# Deployment layer for the existing, unmodified Ageis (SafeShell)
# application. See docs/deployment.md for the full setup/troubleshooting
# guide and the reasoning behind the choices here (especially "why noVNC"
# and the sandbox-capability grants below).
#
#   cp .env.example .env
#   docker compose up --build
#   open http://localhost:6080   (or ${NOVNC_PORT} if you changed it)

services:
  ageis:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ageis-safeshell:local
    container_name: ageis-safeshell
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # `main.rs::build_ai_backend` reads these exactly as it does outside
      # Docker (docs/architecture.md §21.10) — only the endpoint default
      # changes, from `localhost` to the Compose service name `ollama` so
      # the two containers can reach each other over the internal network.
      SAFESHELL_OLLAMA_MODEL: "${SAFESHELL_OLLAMA_MODEL:-llama3.2:latest}"
      SAFESHELL_OLLAMA_ENDPOINT: "${SAFESHELL_OLLAMA_ENDPOINT:-http://ollama:11434}"
      SAFESHELL_OLLAMA_TIMEOUT_MS: "${SAFESHELL_OLLAMA_TIMEOUT_MS:-30000}"
      # Optional VNC password — see docker/entrypoint.sh and
      # docs/deployment.md's security note. Empty by default, which is
      # only safe because NOVNC_PORT below is bound to 127.0.0.1.
      VNC_PASSWORD: "${VNC_PASSWORD:-}"
      SCREEN_GEOMETRY: "${SCREEN_GEOMETRY:-1440x900x24}"
    ports:
      # Bound to localhost only by default — see VNC_PASSWORD above. Change
      # to "${NOVNC_PORT:-6080}:6080" (dropping the 127.0.0.1: prefix) only
      # if you also set VNC_PASSWORD and understand the tradeoff.
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
    volumes:
      # SafeShell's own SQLite DB + per-session layered filesystem state
      # (`main.rs::data_dir`, under $XDG_DATA_HOME=/data — set in
      # docker/Dockerfile). Named volume so session/transaction history
      # survives `docker compose down` (but not `down -v`).
      - ageis_data:/data
      # Docker mounts /sys/fs/cgroup read-only by default, which blocks
      # SafeShell's own cgroups v2 delegation probe from creating a
      # nested cgroup even with cap_add: SYS_ADMIN above — verified
      # empirically: without this line, `cat /sys/fs/cgroup/...` works
      # but `mkdir /sys/fs/cgroup/anything` fails with EROFS regardless
      # of capabilities. Rebinding it read-write is the standard, narrow
      # fix for exactly this (the same one used to run systemd or nested
      # containers under Docker) — it does not grant anything beyond
      # cgroup delegation, and does not touch SafeShell's own
      # `sandbox/cgroups.rs` logic, which still enforces its own
      # `pids.max`/`memory.max`/`cpu.max` limits exactly as designed.
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # ---- Sandbox capability grants — see docs/deployment.md's
    # "Sandbox compatibility inside Docker" section for exactly what each
    # of these does and does not enable, and what SafeShell's own
    # preflight report shows once running. Deliberately NOT
    # `privileged: true` (that would also disable Docker's own device
    # isolation and is broader than anything SafeShell's sandbox layer
    # actually needs) and nothing here changes SafeShell's OWN
    # seccomp/Landlock/namespace code — only the outer Docker-level
    # restrictions that would otherwise block it from attempting those
    # syscalls at all.
    cap_add:
      - SYS_ADMIN
      # Lets the container's entrypoint (running briefly as root before it
      # drops to the non-root `ageis` user — see docker/entrypoint.sh)
      # grant the `safeshell` binary CAP_SYS_ADMIN as a *file* capability
      # via `setcap`. Verified empirically: `setcap` needs CAP_SETFCAP,
      # which `docker build` never grants to RUN steps regardless of any
      # cap_add here (build-time and run-time capability grants are
      # separate mechanisms) — so this has to happen at container start,
      # not at build time.
      - SETFCAP
    security_opt:
      - "seccomp=unconfined"
      - "apparmor=unconfined"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ageis-ollama
    volumes:
      # Model weights — the whole point of a named volume here: pulled
      # once via `docker compose exec ollama ollama pull <model>` (see
      # docs/deployment.md), never baked into an image layer, and never
      # re-downloaded on a plain `docker compose up --build`.
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  ageis_data:
  ollama_data:
