[package]
name = "safeshell"
version = "0.1.0"
edition = "2021"
description = "SafeShell: transactional, simulated-then-executed shell command pipeline"
license = "UNLICENSED"
publish = false
# Without this, `cargo run` can't infer a default binary once more than
# one `[[bin]]` target exists — the `safeshell-*` coreutils sidecars
# (`src/bin/`) made that ambiguous. `safeshell` (this app) is the only
# one anyone runs directly; the sidecars are only ever invoked by
# `handlers::coreutils_proc` via an explicit path, never by name lookup.
default-run = "safeshell"

[lib]
name = "safeshell"
path = "src/lib.rs"

[[bin]]
name = "safeshell"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
nix = { version = "0.31", features = ["fs", "sched", "mount", "process", "user", "signal"] }
libc = "0.2"
seccompiler = "0.5"
landlock = "0.4"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# Build order phase 9 (`ai/`): a synchronous HTTP client rather than an
# async stack (`tokio` + async `reqwest`), and no `jsonschema` crate.
# Deliberate deviations from this file's own earlier forward-looking
# comment, both for the same reason — nothing else in this crate is
# async (every pipeline stage, including `executor::execute` and
# `simulation::manager::simulate`, is a plain synchronous call), so a
# blocking client with a real timeout (`ureq`'s `timeout_global`) fits
# the rest of the codebase without introducing async coloring through
# `transaction::manager`. And `ai::schema`'s enums already reject any
# value outside their closed taxonomy via plain `serde` derive (an
# unrecognized `intent`/`risk_level`/`recovery_recommendation.strategy`
# string fails the whole parse) — the same self-validating-loader
# posture `policy::support_tiers::SupportTierTable` already established,
# not something a JSON Schema library adds more correctness to. See
# `ai::backend`'s and `ai::validation`'s module docs.
ureq = { version = "3.4.0", features = ["json"] }

# Build order phase 10 (`ipc/`, `main.rs`): the desktop shell. This dev
# environment's earlier gap — no system webview dev packages
# (`libwebkit2gtk-4.1-dev` and friends) — is closed as of this phase (see
# `orchestrator/mod.rs`'s module doc for what `ipc/` delegates into), so
# `tauri` is now a plain required dependency rather than deferred behind
# an optional "gui" feature: this is a single-binary desktop application:
# `main.rs` *is* the app, not a lib-only crate with an app bolted on
# later. A machine that genuinely can't build the webview bindings can
# still run `cargo test --lib`/`cargo check --lib` against everything in
# `src/` other than `main.rs`/`ipc/`'s Tauri command wiring.
tauri = { version = "2", features = [] }

# `main.rs::main` loads `src-tauri/.env` (if present) before reading any
# `SAFESHELL_*` variable. Purely a convenience over exporting the same
# vars in whichever shell happens to launch the app (`cargo tauri dev`,
# a desktop launcher, ...) — `build_ai_backend`'s env-var-driven
# selection logic and its "deployment choice, not a compile-time one"
# rationale (see that function's doc comment) are unchanged; this only
# changes where the process reads the vars from. `dotenvy` is a
# maintained fork of the unmaintained `dotenv` crate.
dotenvy = "0.15"
uu_wc = "0.10.0"
uu_sort = "0.10.0"
uu_uniq = "0.10.0"
uu_cut = "0.10.0"
uu_head = "0.10.0"
uu_tail = "0.10.0"
uu_date = "0.10.0"
regex = "1.13.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
